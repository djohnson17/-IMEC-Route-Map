<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>IMEC: India-Middle East Europe Corridor — Model 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Polyline decorator for arrow animation -->
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.7.0/dist/leaflet.polylineDecorator.min.js"></script>

    <!-- MovingMarker plugin (required for animated markers) -->
    <script src="https://rawcdn.githack.com/ewoken/Leaflet.MovingMarker/master/MovingMarker.js"></script>

    <!-- PapaParse decorator for arrow animation (used for arrows if wanted) -->
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

    <link rel="stylesheet" href="styles.css"/>

    <style>

        #page-title {
            position: fixed;
            top: 78px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9980;
            font-weight: 900;
            font-size: 22px;
            color: #0e2a19;
            pointer-events: none;
        }

        #logo-bottom {
            position: fixed;
            left: 14px;
            bottom: 12px;
            z-index: 10050;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            pointer-events: none;
        }
        #logo-bottom img { 
            height: 60px; 
            display: block; 
            width: auto;
        }

        #inset {
            position: fixed;
            right: 14px;
            bottom: 14px;
            width: 240px;
            height: 320px;
            z-index: 5000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            background: #fff;
            border: 3px solid rgba(0, 0, 0, 0.45);
        }

        .inset-title {
            position: absolute;
            z-index: 6000;
            left: 8px;
            top: 6px;
            font-weight: 800;
            font-size: 14px;
        }

        #map {
            position: fixed;
            top: 0; 
            bottom: 0;
            left: 0;
            right: 0;
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: rgba(36,59,47,0.85);
            color: #fff;
            z-index: 10050;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: auto;
        }
        .navbar.visible { opacity: 1; transform: translateY(0); }

        /* left section */
        .navbar .left { display: flex; align-items: center; gap: 12px; }
        .brand { color: #f1f1f1; font-weight: 600; letter-spacing:0.4px; }

        .nav-links { list-style: none; margin: 0; padding: 0; display:flex; gap: 14px; align-items:center; }
        .nav-links li { display: inline-block; }
        .nav-links a { text-decoration:none; color:#e6f0e9; font-weight:600; padding:8px 10px; border-radius:6px; }
        

    </style>
</head>
<body>

    <!-- Top title -->
     <div id="page-title">India-Middle East Corridor</div>

    <!-- Navbar -->
    <nav id ="site-navbar" class="navbar">
        <div class="left">
            <img id="logo" src="img/GC Logo 2024 White Horiz.png" alt="Grungras logo" style="height: 36px;">
            <span class="brand">Grungras Consultancy</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html" class="navbar-logo">Home</a></li>
            <li><a href="model1.html" class="navbar-link active">Model 1</a></li>
            <li><a href="model2.html" class="navbar-link">Model 2</a></li>
            <li><a href="model3.html" class="navbar-link">Model 3</a></li>
        </ul>
    </nav>

    <!-- Bottom-left logo/name -->
    <div id="logo-bottom">
        <img src="img/GC Logo Black BkGnd 2024 isolated.png" alt="Grungras logo">
    </div>

    <!-- inset map for Israel/Jordan -->
    <div id="inset">
        <div class="inset-title">Israel, Jordan, West Bank & Gaza</div>
        <div id="inset-map" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Map container -->
    <div id="map"></div>

    <script>

        // --- nav bar ---
        document.addEventListener('DOMContentLoaded', () => {

            const navbar = document.getElementById('site-navbar');

            function setVisibility(visible) {
                if (visible) {
                    navbar.classList.add('visible');
                } else {
                    navbar.classList.remove('visible');
                }
            }

            //setVisibility(false);

            document.addEventListener('mousemove', e => {
                const nearTop = e.clientY < 80 || navbar.matches(':hover');
                setVisibility(nearTop);
            });

            window.addEventListener('focusin', () => setVisibility(true));
            window.addEventListener('focusout', () => setVisibility(false));
            
            // --- map init ----
            const map = L.map('map', { zoomControl: false}).setView([30, 45], 4.25);
            L.control.zoom({ position: 'topleft' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap & CARTO',
                maxZoom: 19
            }).addTo(map);

            // ---------- Panes ----------
            map.createPane('countriesPane');    map.getPane('countriesPane').style.zIndex = 200;
            map.createPane('imecRoutePane');    map.getPane('imecRoutePane').style.zIndex = 300;
            map.createPane('iconsPane');        map.getPane('iconsPane').style.zIndex = 400;
            map.createPane('labelsPane');       map.getPane('labelsPane').style.zIndex = 500;

            // --- styles + colors --- 
            const ROUTE_COLOR = '#d32f2f';
            const NON_IMECCOUNTRY_COLOR = '#e8e0d0';
            const IMEC_HIGHLIGHT_FILL_OPACITY = 0.86;
            const IMEC_OTHER_FILL_OPACITY = 0.55;

            const countryColors = {
                'Greece': '#c27a00',
                'Israel': '#a8432a',
                'Jordan': '#8b4a9a',
                'Saudi Arabia': '#2e7d32',
                'United Arab Emirates': '#b33b6f',
                'India': '#8b4513',
            };

            const medCoords = [
                [35.9,-6.4],[36.3,-1.2],[36.9, 9.6],[36.5, 15.0],[35.4, 20.0],
                [34.0, 25.0],[33.0, 30.0],[33.3, 35.0],[33.9,36.6],[34.7, 31.0],[34.4,24.0],
                [33.3, 19.0],[33.0,14.0],[34.6,8.0],[36.0,2.5]
            ];

            const persionGulfCoords = [
                [30.1,46.5],[28.8,47.0],[26.8,49.0],[24.0,53.0],[24.8,56.0],[27.4,55.5],
                [29.6,52.5],[31.2,50.8],[31.5,49.9],[31.3,49.0]
            ];

            const arabianSeaCoords = [
                [12.0,57.0],[14.0,60.0],[16.0,63.0],[18.0,66.0],[20.0,70.0],
                [18.5,73.0],[16.5,75.5],[14.0,76.5],[11.5,75.0],[9.0,72.0],
                [7.5,69.0],[6.5,64.0],[7.5,60.0],[9.5,58.0]
            ];

            const seaOptions = { color: 'rgba(0,0,0,0)', fillColor: '#88d7ff', fillOpacity: 0.50, weight: 0, interactive: false };

            const countryLabelOffsets = {
                'Greece': [0.7, -2.5],
                'Saudi Arabia': [0, -5.0],
                'Jordan': [-1.2, 0],
                'India': [0, -5.0],
                'United Arab Emirates': [-0.2, 1.0],
            }

            // --- add world geojson and style countries ---

            fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
                .then(r => r.json())
                .then(geojson => {
                    L.geoJSON(geojson, {
                        pane: 'countriesPane',

                        style: feature => {
                            const name = feature.properties.name;
                            if (countryColors[name]) {
                                return { color: '#666', weight: 1, fillColor: countryColors[name], fillOpacity: IMEC_HIGHLIGHT_FILL_OPACITY };
                            }
                            return { color: '#bbb', weight: 1, fillColor: NON_IMECCOUNTRY_COLOR, fillOpacity: IMEC_OTHER_FILL_OPACITY };
                        },
                        onEachFeature: (feature, layer) => {
                            const name = feature.properties.name;
                            
                            if (!countryColors[name]) return;

                            let center = layer.getBounds().getCenter();

                            if (countryLabelOffsets[name]) {
                                center = L.latLng(
                                    center.lat + countryLabelOffsets[name][0],
                                    center.lng + countryLabelOffsets[name][1]
                                );
                            }

                            L.marker(center, { 
                                opacity: 0, 
                                pane: 'labelsPane' 
                            })
                            .bindTooltip(name, {
                                permanent: true,
                                direction: 'center',
                                className: 'country-label-no-bg',
                            })
                            .addTo(map);

                        
                        },
                        interactive: false
                    }).addTo(map);
                })
                .catch(err => console.error('Error loading geojson:', err));

            function updateCountryLabels() {
                const zoom = map.getZoom();
                const show = zoom >= 4;

                document.querySelectorAll('.country-label-no-bg').forEach(el => {
                    el.style.display = show ? 'block' : 'none';
                });
            }

            map.on('zoomend', updateCountryLabels);
            updateCountryLabels();

            const territoriesGEOJSON = {
                "type": "FeatureCollection",
                "features": [
                    {
                        "type": "Feature",
                        "properties": { "name": "West Bank" },
                        "geometry": {
                            "type": "Polygon",
                            "coordinates": [[
                                [34.926412, 31.349967],
                                [35.461996, 31.490598],
                                [35.552633, 32.385611],
                                [35.374105, 32.513087],
                                [35.212057, 32.559397],
                                [35.025289, 32.253309],
                                [34.978597, 32.106856],
                                [35.080221, 31.827248],
                                [35.226153, 31.765687],
                                [34.972529, 31.617153],
                                [34.923534, 31.343689],
                                [34.898371, 31.441570],
                                [34.926412, 31.349967] 
                            ]]
                        }
                    },
                    {
                        "type": "Feature",
                        "properties": { "name": "Gaza Strip" },
                        "geometry": {
                            "type": "Polygon",
                            "coordinates": [[
                                [34.220337, 31.324945],
                                [34.267239, 31.226295],
                                [34.372982, 31.307289],
                                [34.371609, 31.372973],
                                [34.565243, 31.539322],
                                [34.491086, 31.591976],
                                [34.220337, 31.324945]
                            ]]
                        }
                    }
                ]
            };

            const territoryFill = {
                'West Bank': '#ffd54f',
                'Gaza Strip': '#ec407a',
            };

            function addTerritories(targetMap) {
                L.geoJSON(territoriesGEOJSON, {
                    pane: 'countriesPane',

                    style: feature => ({
                        color: '#666', 
                        weight: 1, 
                        fillColor: territoryFill[feature.properties.name] || '#f0c090',
                        fillOpacity: 0.9
                    }),
                    onEachFeature: (feature, layer) => {
                        const name = feature.properties.name;
                        const center = layer.getBounds().getCenter();

                        L.marker(center, { opacity: 0, pane: 'labelsPane' }).bindTooltip(name, {
                            permanent: true,
                            direction: 'center',
                            className: 'territory-label'
                        })
                        .addTo(targetMap);
                    },
                    interactive: false
                }).addTo(targetMap);
            }

            function addCountries(targetMap) {
                fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
                    .then(r => r.json())
                    .then(geojson => {
                        L.geoJSON(geojson, {
                            pane: 'countriesPane',

                            style: feature => {
                                const name = feature.properties.name;
                                if (countryColors[name]) {
                                    return { color: '#666', weight: 1, fillColor: countryColors[name], fillOpacity: IMEC_HIGHLIGHT_FILL_OPACITY };
                                }
                                return { color: '#bbb', weight: 1, fillColor: NON_IMECCOUNTRY_COLOR, fillOpacity: IMEC_OTHER_FILL_OPACITY };
                            },
                            interactive: false
                        }).addTo(targetMap);
                    })
                    .catch(err => console.error('Error loading geojson:', err));
            }
            
            // ---------- IMEC route waypoints (approximate) ----------
            const routePoints = {
                greece_piraeus: [37.94, 23.64],
                israel_haifa: [32.82, 34.99],

                north_westbank: [32.6, 35.3],
                
                sa_alHadithah: [31.48, 37.15],
                sa_riyadh: [24.71, 46.68],
                sa_haradh: [24.14, 49.08],
                uae_alGhuwaifat: [24.13, 51.63],
                uae_jabelAli: [25.02, 55.13],

                india_mumbai: [18.96, 72.83],
            };

            const ports = {
                greece_piraeus: 'Piraeus',
                israel_haifa: 'Haifa',
                uae_jabelAli: 'Jabel Ali',
                india_mumbai: 'Mumbai',
                uae_alGhuwaifat: 'Al Ghuwaifat',
            }

            const portLabelOffsets = {
                greece_piraeus: [0.3, -0.8],
                israel_haifa: [-0.3, -0.25],
                uae_jabelAli: [0.8, -0.3],
                india_mumbai: [0.7, 0],
                uae_alGhuwaifat: [0.6, -0.2]
            };

            const waypointIcon = L.divIcon({
                className: 'waypoint-dot',
                iconSize: [10, 10],
                iconAnchor: [6, 6],
            });

            const waypointKeys = ['greece_piraeus', 'israel_haifa', 'uae_alGhuwaifat', 'uae_jabelAli', 'india_mumbai'];
            waypointKeys.forEach(k => {
                const coord = routePoints[k];
                if (!coord) return;

                L.marker(coord, { icon: waypointIcon, pane: 'iconsPane', interactive: false }).addTo(map);

                if (ports[k]) {

                    const offset = portLabelOffsets[k] || [0.4, 0.2];

                    const labelLatLng = [
                        coord[0] + offset[0],
                        coord[1] + offset[1]
                    ];
                    // const labelPos = [ coord[0] + offset[0], coord[1] + offset[1] ];

                    L.polyline([coord, labelLatLng], { 
                        color: '#243b2f', 
                        weight: 2, 
                        dashArray: '4,3', 
                        pane: 'labelsPane', 
                        interactive: false 
                    }).addTo(map);

                    L.marker(labelLatLng, { opacity: 0, pane: 'labelsPane'})
                    .bindTooltip(ports[k], {
                        permanent: true,
                        direction: 'center',
                        className: 'port-label-no-bg',
                    })
                    .addTo(map);
                }
            });

            function densifyPath(path, segmentsPerLeg=40){
                const out = [];
                for(let i=0;i<path.length-1;i++){
                    const a = path[i], b = path[i+1];
                    for(let s=0;s<segmentsPerLeg;s++){
                        const t = s/segmentsPerLeg;
                        const lat = a[0] + (b[0]-a[0]) * t;
                        const lng = a[1] + (b[1]-a[1]) * t;
                        out.push([lat, lng]);
                    }
                }
                out.push(path[path.length-1]);
                return out;
            }


            // Add waypoint markers

            const seaSegment1 = [
                routePoints.greece_piraeus,
                routePoints.israel_haifa
            ];

            const seaSegment2 = [
                routePoints.uae_jabelAli,
                routePoints.india_mumbai
            ];

            const landSegment = [
                routePoints.israel_haifa,
                routePoints.north_westbank,
                routePoints.sa_alHadithah,
                routePoints.sa_riyadh,
                routePoints.sa_haradh,
                routePoints.uae_alGhuwaifat,
                routePoints.uae_jabelAli
            ];


            const sea1Smooth = densifyPath(seaSegment1, 60);
            const landSmooth = densifyPath(landSegment, 40);
            const sea2Smooth = densifyPath(seaSegment2, 60);

            // ---------- Draw IMEC route ---------

            const imecSea1 = L.polyline(sea1Smooth, {color: ROUTE_COLOR, weight: 4, pane: 'imecRoutePane', opacity: 0.95, lineJoin:'round' }).addTo(map);
            const imecLand = L.polyline(landSmooth, {color: ROUTE_COLOR, weight: 4, pane: 'imecRoutePane', opacity: 0.95, lineJoin:'round' }).addTo(map);
            const imecSea2 = L.polyline(sea2Smooth, {color: ROUTE_COLOR, weight: 4, pane: 'imecRoutePane', opacity: 0.95, lineJoin:'round' }).addTo(map);

            //Full IMEC (land + sea)
            const imecFullRoute = L.polyline(
                sea1Smooth.concat(landSmooth.slice(1), sea2Smooth.slice(1)),
                { 
                    color: ROUTE_COLOR, 
                    weight: 4, 
                    opacity: 0.92,
                    pane: 'imecRoutePane',
                }
            ).addTo(map);

            
            function midpoint(path){
                if (!path || path.length < 2) {
                    console.error('Invalid path passed to midpointOnPath:', path);
                    return null;
                }

                let total = 0;
                for (let i = 1; i < path.length; i++) {
                    total += map.distance(path[i - 1], path[i]);
                }

                let half = total / 2;
                let acc = 0;

                for (let i = 1; i < path.length; i++) {
                    const seg = map.distance(path[i - 1], path[i]);
                    if (acc + seg >= half) {
                        const t = (half - acc) / seg;
                        return [
                            path[i - 1][0] + (path[i][0] - path[i - 1][0]) * t,
                            path[i - 1][1] + (path[i][1] - path[i - 1][1]) * t
                        ];
                    }
                    acc += seg;
                }

                return path[Math.floor(path.length / 2)];
            }
          

            const ship1Pos = midpoint(sea1Smooth);

            const ship2Pos = midpoint(sea2Smooth);

            const trainPos = midpoint(landSmooth);

            // ------ ICONS ------
            const commonIconOpts = { iconSize: [32, 32], iconAnchor: [16, 16], className: 'icon-facing'}

            const trainIcon = L.icon({
                iconUrl: 'img/railway-icon.png',
                iconSize: commonIconOpts.iconSize,
                iconAnchor: commonIconOpts.iconAnchor,
                className: commonIconOpts.className
            });

            const shipIcon = L.icon({
                iconUrl: 'img/cruise-icon.png',
                iconSize: commonIconOpts.iconSize,
                iconAnchor: commonIconOpts.iconAnchor,
                className: commonIconOpts.className
            });

            L.marker(ship1Pos, { icon: shipIcon, interactive: false, pane: 'iconsPane' }).addTo(map);
            L.marker(ship2Pos, { icon: shipIcon, interactive: false, pane: 'iconsPane' }).addTo(map);
            L.marker(trainPos, { icon: trainIcon, interactive: false, pane: 'iconsPane' }).addTo(map);
            
            // ------ Water labels ------
            const waterLabels = [
                { pos: [33.0, 15.0], text: 'Eastern Mediterranean' },
                { pos: [16.0, 64.0], text: 'Arabian Sea' },
            ];

            waterLabels.forEach(w => {
                L.marker(w.pos, { interactive: false, opacity: 0, pane: 'labelsPane' })
                    .bindTooltip(w.text, { permanent: true, direction: 'center', className: 'water-label-no-bg', pane: 'labelsPane' })
                    .addTo(map);
            });


            // ------- Inset map -------
            const insetMap = L.map("inset-map", {
                zoomControl: false,
                attributionControl: false
            });

            insetMap.createPane("countriesPane");
            insetMap.createPane("labelsPane");
            insetMap.createPane("iconsPane");

            insetMap.getPane("countriesPane").style.zIndex = 200;
            insetMap.getPane("labelsPane").style.zIndex = 500;
            insetMap.getPane("iconsPane").style.zIndex = 400;

            addCountries(insetMap);
            addTerritories(insetMap);


            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png')
                .addTo(insetMap);

            const insetSea1 = L.polyline(sea1Smooth, { color: ROUTE_COLOR, weight: 3 }).addTo(insetMap);
            const insetLand = L.polyline(landSmooth, { color: ROUTE_COLOR, weight: 3 }).addTo(insetMap);
            const insetSea2 = L.polyline(sea2Smooth, { color: ROUTE_COLOR, weight: 3 }).addTo(insetMap);
            
            Object.keys(ports).forEach(key => {
                const coord = routePoints[key];
                if (!coord) return;

                const offset = portLabelOffsets[key] || [0.6, 0];
                const labelPos = [ coord[0] + offset[0], coord[1] + offset[1] ];

                L.marker(coord, { icon: waypointIcon, interactive: false, pane: 'iconsPane' }).addTo(insetMap);

                L.polyline([coord, labelPos], { 
                    color: '#243b2f', 
                    weight: 1.2, 
                    dashArray: '3,3', 
                    interactive: false 
                }).addTo(insetMap);

                L.marker(labelPos, { interactive: false, opacity: 0 }).bindTooltip(ports[key], {
                    permanent: true, direction: 'top', className: 'port-label-no-bg', offset: [0, -8]
                }).addTo(insetMap);
            });

            addTerritories(insetMap);

            const insetBounds = [
                [30.5, 33.0],
                [34.3, 37.5]
            ];
            insetMap.fitBounds(insetBounds);
        });
    
    </script>
</body>
</html>
